name: PyPI release

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cfripper
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup UV
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: '3.10'
          enable-cache: false
          version: latest-known

      - name: Build package
        run: make build

      - name: Install dev dependencies
        run: make install-dev

      - name: Check package
        run: make check-package

      - name: Publish distribution 📦 to PyPI
        # zizmor: ignore[use-trusted-publishing] https://github.com/pypi/warehouse/issues/17700
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.pypi_publish_token }}
