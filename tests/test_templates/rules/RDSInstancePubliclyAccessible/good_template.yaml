AWSTemplateFormatVersion: 2010-09-09
Resources:
  PrivateDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      PubliclyAccessible: false
  DefaultDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
  PrivateCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      PubliclyAccessible: false
